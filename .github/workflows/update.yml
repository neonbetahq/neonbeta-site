name: Update deals
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch deals
        run: python fetch_deals.py
      - name: Post new lows to Discord
        run: python post_discord.py
        env:
          DISCORD_WEBHOOK_LOWS: ${{ secrets.DISCORD_WEBHOOK_LOWS }}
          DISCORD_ROLE_PRICE_DROP: ${{ secrets.DISCORD_ROLE_PRICE_DROP }}
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Update deals" && git push)
