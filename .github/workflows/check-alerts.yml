name: Check price alerts
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check alerts
        run: python bot/check_alerts.py
        env:
          ALERTS_URL: ${{ secrets.ALERTS_URL }}
          ALERTS_ADMIN_KEY: ${{ secrets.ALERTS_ADMIN_KEY }}
          DISCORD_WEBHOOK_ALERTS: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
